name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string
      ppa_revision:
        description: PPA upload revision; raise it to upload a version Launchpad already has again
        required: false
        type: string
        default: "1"

permissions:
  contents: read

env:
  # One PPA carries this package, Keysharp and the other component, so a single repository installs them.
  # Launchpad builds each series from its own source upload. Adding one here adds its build and rehearsal.
  PPA: descolada/keysharp
  PPA_SERIES: noble resolute

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      ppa_series: ${{ steps.release.outputs.ppa_series }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Resolve immutable release source
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v followed by a three-part numeric version. Got '$RELEASE_TAG'." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release source must be an existing tag named $RELEASE_TAG." >&2
            exit 1
          fi
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$tag_sha" ]]; then
            echo "Checked-out source does not match refs/tags/$RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD:third_party/keysharp-permissions)" != "b8f31942dd2c286608d390634a9916bffce55ddf" \
             || "$(git -C third_party/keysharp-permissions rev-parse HEAD)" != "b8f31942dd2c286608d390634a9916bffce55ddf" ]]; then
            echo "keysharp-permissions submodule is not at the reviewed pin." >&2
            exit 1
          fi
          version=$(sed -n '/^project(keysharp-desktop/,/LANGUAGES C)/s/^[[:space:]]*VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          if [[ -z "$version" || "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not exactly match CMake project version ${version:-<missing>}." >&2
            exit 1
          fi
          header_version=$(sed -n 's/^#define KSD_PRODUCT_VERSION "\([0-9.]*\)"$/\1/p' \
            src/protocol.h)
          nix_version=$(sed -n 's/^[[:space:]]*version = "\([0-9.]*\)";$/\1/p' nix/package.nix)
          if [[ "$header_version" != "$version" || "$nix_version" != "$version" ]]; then
            echo "Release version is inconsistent across CMake, the private protocol, and Nix packaging." >&2
            exit 1
          fi

          echo "source_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ppa_series=$(jq -cn --arg series "$PPA_SERIES" '$series | split(" ")')" >> "$GITHUB_OUTPUT"

  nix:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Validate Nix package
        run: nix flake check --no-write-lock-file

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # Native release artifacts target Ubuntu 22.04's glibc 2.35 baseline; CI covers the current image.
      matrix:
        include:
          - runner: ubuntu-22.04
            asset_arch: x64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            asset_arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    name: Build Linux ${{ matrix.asset_arch }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake gcc pkg-config polkitd xvfb \
            libglib2.0-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-composite0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libwayland-dev libwayland-bin wayland-protocols

      # ubuntu-24.04 ships wayland-protocols 1.34, and ext-data-control-v1 --
      # the clipboard protocol -- arrived in 1.39. The package is data only, so
      # a pinned checkout is cheaper and more reproducible than a PPA, and it
      # keeps the definitions read at build time rather than vendored here.
      - name: Fetch wayland-protocols carrying ext-data-control
        run: >-
          git clone --depth 1 --branch 1.39
          https://gitlab.freedesktop.org/wayland/wayland-protocols.git
          "$RUNNER_TEMP/wayland-protocols"

      - name: Configure and build
        run: |
          cmake -S . -B build-portable \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=ON \
            -DKEYSHARP_DESKTOP_WAYLAND_PROTOCOL_DIR="$RUNNER_TEMP/wayland-protocols"
          cmake --build build-portable --parallel
          ctest --test-dir build-portable --output-on-failure
          cmake -S . -B build-deb \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF \
            -DKEYSHARP_DESKTOP_SETUP_ON_INSTALL=OFF \
            -DKEYSHARP_DESKTOP_WAYLAND_PROTOCOL_DIR="$RUNNER_TEMP/wayland-protocols"
          cmake --build build-deb --parallel

      - name: Assemble release files
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STAGE: ${{ runner.temp }}/keysharp-desktop-stage
        shell: bash
        run: |
          chmod +x uninstall.sh packaging/install-release.sh \
            packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
          DESTDIR="$STAGE" cmake --install build-portable --strip
          test -x "$STAGE/usr/local/bin/keysharp-desktop"
          test -x "$STAGE/usr/local/libexec/keysharp-desktop-capture-worker"
          test "$(stat -c %a "$STAGE/usr/local/libexec/keysharp-desktop-capture-worker")" = 700
          test -e "$STAGE/usr/local/lib/libkeysharp-desktop.so.1"
          readelf -d "$STAGE/usr/local/bin/keysharp-desktop" | grep -q 'Shared library: \[libkeysharp-desktop.so.1\]'
          readelf -d "$STAGE/usr/local/lib/libkeysharp-desktop.so.1.0.0" | grep -q 'Library soname: \[libkeysharp-desktop.so.1\]'

          mkdir -p dist
          archive_name="keysharp-desktop-${VERSION}-linux-${ASSET_ARCH}"
          archive_root="dist/${archive_name}"
          mkdir -p "$archive_root/payload"
          cp -a "$STAGE/usr" "$archive_root/payload/usr"
          install -m 0755 packaging/install-release.sh "$archive_root/install.sh"
          install -m 0755 packaging/check-runtime.sh "$archive_root/check-runtime.sh"
          install -m 0755 uninstall.sh "$archive_root/uninstall.sh"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            -C dist -czf "dist/${archive_name}.tar.gz" "$archive_name"
          rm -rf "$archive_root"

          cpack -G DEB --config build-deb/CPackConfig.cmake -B build-deb/packages
          deb=$(find build-deb/packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$DEB_ARCH"
          deb_name="keysharp-desktop_${VERSION}_${DEB_ARCH}.deb"
          cp "$deb" "dist/${deb_name}"
          dpkg-deb --info "dist/${deb_name}"

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/keysharp-desktop-${{ needs.prepare.outputs.version }}-linux-${{ matrix.asset_arch }}.tar.gz
            dist/keysharp-desktop_${{ needs.prepare.outputs.version }}_${{ matrix.deb_arch }}.deb

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: keysharp-desktop-linux-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - nix
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag did not move
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"

      - uses: actions/download-artifact@v8
        with:
          pattern: keysharp-desktop-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" == "true" ]]; then
              gh release upload "$TAG" dist/* --clobber
            else
              gh release upload "$TAG" dist/*
            fi
          else
            gh release create "$TAG" dist/* --generate-notes --verify-tag
          fi

  ppa-source:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive

      - name: Install Debian source tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends debhelper

      - name: Build source uploads
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ env.PPA_SERIES }}
          PPA_REVISION: ${{ inputs.ppa_revision || '1' }}
        run: bash packaging/ppa/build-source.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ppa-source
          path: dist/ppa/*
          if-no-files-found: error

  # Launchpad accepts a version once, so every series and architecture is built here first, offline
  # and unprivileged, the way its builders do.
  ppa-rehearse:
    needs:
      - prepare
      - ppa-source
    name: Rehearse PPA build (${{ matrix.series }} ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.prepare.outputs.ppa_series) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ppa-source
          path: dist/ppa

      - name: Build as Launchpad would
        env:
          SERIES: ${{ matrix.series }}
        run: bash packaging/ppa/rehearse.sh dist/ppa/keysharp-desktop_*~"$SERIES"*.dsc "$SERIES" dist/rehearsal

  # Independent of the GitHub publish job, which refuses a rerun once the release exists, so a rerun
  # still uploads just the series Launchpad does not have.
  publish-ppa:
    needs:
      - prepare
      - ppa-rehearse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ppa-source
          path: dist/ppa

      - name: Install upload tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts dput

      - name: Sign and upload
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: bash packaging/ppa/upload.sh "$PPA" dist/ppa/*_source.changes
